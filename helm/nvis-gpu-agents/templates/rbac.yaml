---
# ServiceAccount used by all nvis-gpu-agents pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvis-gpu-agents
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nvis-gpu-agents.labels" . | nindent 4 }}
---
# ClusterRole — Alloy needs to read pod/node info for K8s service discovery
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nvis-gpu-agents-{{ .Release.Name }}
  labels:
    {{- include "nvis-gpu-agents.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvis-gpu-agents-{{ .Release.Name }}
  labels:
    {{- include "nvis-gpu-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nvis-gpu-agents-{{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: nvis-gpu-agents
    namespace: {{ .Values.namespace }}
