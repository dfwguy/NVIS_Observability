# helm-conditional: skip yaml validation when block present
{{- if .Values.integrations.netq.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvis-netq-exporter
  labels:
    app.kubernetes.io/name: nvis-netq-exporter
    app.kubernetes.io/component: netq-exporter
    app.kubernetes.io/part-of: nvis-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nvis-netq-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvis-netq-exporter
        app.kubernetes.io/component: netq-exporter
        app.kubernetes.io/part-of: nvis-platform
    spec:
      restartPolicy: Always
      containers:
        - name: netq-exporter
          # Placeholder image -- override .Values.image.registry or build from source.
          image: "{{ .Values.image.registry | default "ghcr.io/nvidia-nvis" }}/nvis-platform/netq:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: metrics
              containerPort: 9109
              protocol: TCP
          env:
            - name: PORT
              value: "9109"
            - name: CLUSTER_NAME
              value: "{{ .Values.cluster.name }}"
            - name: NETQ_URL
              valueFrom:
                secretKeyRef:
                  name: nvis-netq-credentials
                  key: url
            - name: NETQ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nvis-netq-credentials
                  key: token
                  optional: true
            - name: NETQ_USER
              valueFrom:
                secretKeyRef:
                  name: nvis-netq-credentials
                  key: user
                  optional: true
            - name: NETQ_PASS
              valueFrom:
                secretKeyRef:
                  name: nvis-netq-credentials
                  key: pass
                  optional: true
            - name: SCRAPE_INTERVAL
              value: "{{ .Values.integrations.netq.scrapeInterval | default 30 }}"
            - name: HTTP_TIMEOUT
              value: "{{ .Values.integrations.netq.httpTimeout | default 15 }}"
            - name: VERIFY_SSL
              value: "{{ .Values.integrations.netq.verifySSL | default "true" }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nvis-netq-exporter
  labels:
    app.kubernetes.io/name: nvis-netq-exporter
    app.kubernetes.io/component: netq-exporter
    app.kubernetes.io/part-of: nvis-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nvis-netq-exporter
  ports:
    - name: metrics
      port: 9109
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvis-netq-exporter
  labels:
    app.kubernetes.io/name: nvis-netq-exporter
    app.kubernetes.io/component: netq-exporter
    app.kubernetes.io/part-of: nvis-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvis-netq-exporter
  endpoints:
    - port: metrics
      interval: {{ .Values.integrations.netq.scrapeInterval | default 30 }}s
      scrapeTimeout: 25s
      path: /metrics
{{- end }}
