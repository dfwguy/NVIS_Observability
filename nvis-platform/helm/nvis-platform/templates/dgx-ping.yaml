# helm-conditional: skip yaml validation when block present
{{- if .Values.integrations.dgxPing.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvis-dgx-ping-config
  labels:
    app.kubernetes.io/name: nvis-dgx-ping
    app.kubernetes.io/component: dgx-ping-exporter
    app.kubernetes.io/part-of: nvis-platform
data:
  # `hosts` is a newline-separated `name=ip` list (commas also accepted,
  # `#` starts a comment). The exporter reads it via `DGX_HOSTS=@/etc/dgx-ping/hosts`.
  hosts: |
    {{- range .Values.integrations.dgxPing.hosts }}
    {{ . }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvis-dgx-ping
  labels:
    app.kubernetes.io/name: nvis-dgx-ping
    app.kubernetes.io/component: dgx-ping-exporter
    app.kubernetes.io/part-of: nvis-platform
spec:
  # A single replica is sufficient: this exporter pings external hosts,
  # not in-cluster pods, so horizontal scaling adds no value.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nvis-dgx-ping
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvis-dgx-ping
        app.kubernetes.io/component: dgx-ping-exporter
        app.kubernetes.io/part-of: nvis-platform
      annotations:
        checksum/hosts: {{ .Values.integrations.dgxPing.hosts | toYaml | sha256sum }}
    spec:
      restartPolicy: Always
      containers:
        - name: dgx-ping
          image: "{{ .Values.image.registry | default "ghcr.io/nvidia-nvis" }}/nvis-platform/dgx-ping:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: metrics
              containerPort: {{ .Values.integrations.dgxPing.port | default 9116 }}
              protocol: TCP
          env:
            - name: LISTEN_PORT
              value: "{{ .Values.integrations.dgxPing.port | default 9116 }}"
            - name: CLUSTER_NAME
              value: "{{ .Values.cluster.name }}"
            - name: DGX_HOSTS
              value: "@/etc/dgx-ping/hosts"
            - name: PING_INTERVAL
              value: "{{ .Values.integrations.dgxPing.pingInterval | default 30 }}"
            - name: PING_COUNT
              value: "{{ .Values.integrations.dgxPing.pingCount | default 5 }}"
            - name: PING_TIMEOUT
              value: "{{ .Values.integrations.dgxPing.pingTimeout | default 2 }}"
          securityContext:
            # /bin/ping needs CAP_NET_RAW. We otherwise drop everything.
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]
          volumeMounts:
            - name: hosts
              mountPath: /etc/dgx-ping
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: hosts
          configMap:
            name: nvis-dgx-ping-config
            items:
              - key: hosts
                path: hosts
---
apiVersion: v1
kind: Service
metadata:
  name: nvis-dgx-ping
  labels:
    app.kubernetes.io/name: nvis-dgx-ping
    app.kubernetes.io/component: dgx-ping-exporter
    app.kubernetes.io/part-of: nvis-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nvis-dgx-ping
  ports:
    - name: metrics
      port: {{ .Values.integrations.dgxPing.port | default 9116 }}
      targetPort: metrics
      protocol: TCP
{{- end }}
