{{- if .Values.loki.enabled }}
---
# =============================================================================
# Loki ConfigMap
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvis-loki-config
  labels:
    {{- include "nvis-platform.labels" . | nindent 4 }}
    app: nvis-loki
data:
  loki-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: {{ .Values.loki.port }}
      grpc_listen_port: 9096
      log_level: warn
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      ingestion_rate_mb: 32
      ingestion_burst_size_mb: 64
      retention_period: {{ .Values.loki.retention }}
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem
    query_range:
      cache_results: false
---
# =============================================================================
# Loki Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvis-loki
  labels:
    {{- include "nvis-platform.labels" . | nindent 4 }}
    app: nvis-loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nvis-loki
  template:
    metadata:
      labels:
        {{- include "nvis-platform.labels" . | nindent 8 }}
        app: nvis-loki
      annotations:
        checksum/config: {{ .Values.loki.retention | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- include "nvis-platform.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: loki
          image: {{ include "nvis-platform.image" (dict "root" . "repo" .Values.loki.image.repository "tag" .Values.loki.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config.file=/etc/loki/loki-config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.loki.port }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /ready
              port: {{ .Values.loki.port }}
            failureThreshold: 36
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.loki.port }}
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.loki.port }}
            initialDelaySeconds: 45
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: nvis-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: nvis-loki-data
---
# =============================================================================
# Loki Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: nvis-loki
  labels:
    {{- include "nvis-platform.labels" . | nindent 4 }}
    app: nvis-loki
spec:
  type: ClusterIP
  selector:
    app: nvis-loki
  ports:
    - name: http
      port: {{ .Values.loki.port }}
      targetPort: {{ .Values.loki.port }}
      protocol: TCP
{{- end }}
