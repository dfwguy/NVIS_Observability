{{- if .Values.loki.enabled }}
---
# =============================================================================
# Loki StatefulSet
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nvis-loki
  namespace: {{ .Values.namespace }}
  labels:
    app: nvis-loki
    {{- include "nvis-obsvm.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvis-loki
  serviceName: nvis-loki-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nvis-loki
        {{- include "nvis-obsvm.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/loki/configmap.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001   # loki user in official image
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nvis-loki
      containers:
        - name: loki
          image: {{ include "nvis.image" (dict "root" . "repo" .Values.loki.image.repository "tag" .Values.loki.image.tag) }}
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki-config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.loki.port }}
              hostPort: {{ .Values.loki.port }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Loki writes chunks to /loki
            capabilities:
              drop: ["ALL"]
          # Loki first boot is slow (TSDB index compaction)
          startupProbe:
            httpGet:
              path: /ready
              port: {{ .Values.loki.port }}
            failureThreshold: 36    # 180s
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.loki.port }}
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12    # 120s total
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.loki.port }}
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: nvis-loki-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: nvis-loki
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.loki.persistence.storageClass }}
        storageClassName: {{ .Values.loki.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.loki.persistence.size }}
{{- end }}
