{{- if and .Values.thanos.enabled .Values.thanos.querier.enabled (eq (include "nvis.storage" .) "thanos") }}
---
# =============================================================================
# Thanos Querier — unified query layer
# =============================================================================
# The Querier federates queries across:
#   - Prometheus (short-term, recent data)
#   - Thanos Receive (in-flight remote_write data)
#   - Thanos Store Gateway (historical data from object storage)
# Grafana points its "Thanos" datasource at this Querier.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvis-thanos-querier
  namespace: {{ .Values.namespace }}
  labels:
    app: nvis-thanos-querier
    {{- include "nvis-obsvm.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvis-thanos-querier
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nvis-thanos-querier
        {{- include "nvis-obsvm.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nvis-thanos
      containers:
        - name: thanos-querier
          image: {{ include "nvis.image" (dict "root" . "repo" .Values.thanos.image.repository "tag" .Values.thanos.image.tag) }}
          imagePullPolicy: IfNotPresent
          args:
            - query
            - --http-address=0.0.0.0:{{ .Values.thanos.querier.port }}
            - --grpc-address=0.0.0.0:10901
            # Connect to Prometheus sidecar (if using sidecar mode instead of Receive)
            # Uncomment and adjust if you add a Thanos sidecar to Prometheus:
            # - --store=nvis-prometheus-0.nvis-prometheus-headless.{{ .Values.namespace }}.svc:10901
            {{- if .Values.thanos.receive.enabled }}
            - --store=nvis-thanos-receive.{{ .Values.namespace }}.svc:{{ .Values.thanos.receive.grpcPort }}
            {{- end }}
            {{- if .Values.thanos.storeGateway.enabled }}
            - --store=nvis-thanos-store-gateway.{{ .Values.namespace }}.svc:{{ .Values.thanos.storeGateway.grpcPort }}
            {{- end }}
            - --query.replica-label=replica
            - --query.auto-downsampling
          ports:
            - name: http
              containerPort: {{ .Values.thanos.querier.port }}
            - name: grpc
              containerPort: 10901
          resources:
            {{- toYaml .Values.thanos.querier.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /-/ready
              port: {{ .Values.thanos.querier.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: {{ .Values.thanos.querier.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: nvis-thanos-querier
  namespace: {{ .Values.namespace }}
  labels:
    app: nvis-thanos-querier
    {{- include "nvis-obsvm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: nvis-thanos-querier
  ports:
    - name: http
      port: {{ .Values.thanos.querier.port }}
      targetPort: {{ .Values.thanos.querier.port }}
    - name: grpc
      port: 10901
      targetPort: 10901
{{- end }}
