# =============================================================================
# nvis-obsvm — values-production.yaml
# =============================================================================
# Production overrides applied on top of values.yaml.
# Usage: helm upgrade --install nvis-obsvm ./helm/nvis-obsvm \
#          -f helm/nvis-obsvm/values.yaml \
#          -f helm/nvis-obsvm/values-production.yaml
#
# NEVER commit real passwords here. Use:
#   --set grafana.adminPasswordOverride=$(cat /run/secrets/grafana-pw)
# or inject via CI/CD vault.
# =============================================================================

# Larger resource requests for production 4000-node clusters
prometheus:
  resources:
    requests:
      cpu: 2000m
      memory: 8Gi
    limits:
      cpu: 4000m
      memory: 16Gi
  persistence:
    size: 500Gi
    storageClass: "longhorn"    # or "ceph-block", "local-path"
  retention: "30d"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

grafana:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  persistence:
    size: 20Gi
    storageClass: "longhorn"
  serviceType: LoadBalancer   # Use if MetalLB/cloud LB available
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

loki:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  persistence:
    size: 500Gi
    storageClass: "longhorn"
  ingestionRateMb: 128
  ingestionBurstSizeMb: 256

victoriametrics:
  resources:
    requests:
      cpu: 2000m
      memory: 8Gi
    limits:
      cpu: 4000m
      memory: 16Gi
  persistence:
    size: 2000Gi
    storageClass: "longhorn"
  retention: "12"

networkPolicy:
  enabled: true

rbac:
  create: true

# Tighten security contexts in production
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  readOnlyRootFilesystem: false
