{{- if .Values.loki.enabled }}
---
# =============================================================================
# Loki ConfigMap
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvis-loki-config
  namespace: {{ .Values.namespace }}
  labels:
    app: nvis-loki
    {{- include "nvis-obsvm.labels" . | nindent 4 }}
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: {{ .Values.loki.port }}
      grpc_listen_port: 9096
      log_level: warn

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      allow_structured_metadata: true
      ingestion_rate_mb: {{ .Values.loki.ingestionRateMb }}
      ingestion_burst_size_mb: {{ .Values.loki.ingestionBurstSizeMb }}
      retention_period: {{ .Values.loki.retentionPeriod }}
      # Reject logs with timestamps too far in the past (prevents TSDB corruption)
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem

    query_range:
      cache_results: false
{{- end }}
