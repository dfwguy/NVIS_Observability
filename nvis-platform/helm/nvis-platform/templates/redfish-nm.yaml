# helm-conditional: skip yaml validation when block present
{{- if .Values.integrations.redfishNm.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvis-redfish-nm
  labels:
    app.kubernetes.io/name: nvis-redfish-nm
    app.kubernetes.io/component: redfish-nm-exporter
    app.kubernetes.io/part-of: nvis-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nvis-redfish-nm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvis-redfish-nm
        app.kubernetes.io/component: redfish-nm-exporter
        app.kubernetes.io/part-of: nvis-platform
    spec:
      restartPolicy: Always
      containers:
        - name: redfish-nm
          image: "{{ .Values.image.registry | default "ghcr.io/nvidia-nvis" }}/nvis-platform/redfish-nm:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: metrics
              containerPort: 9106
              protocol: TCP
          env:
            - name: PORT
              value: "9106"
            - name: CLUSTER_NAME
              value: "{{ .Values.cluster.name }}"
            - name: BMC_USER
              valueFrom:
                secretKeyRef:
                  name: nvis-bmc-credentials
                  key: user
            - name: BMC_PASS
              valueFrom:
                secretKeyRef:
                  name: nvis-bmc-credentials
                  key: pass
            - name: BMC_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: nvis-bmc-config
                  key: hosts
            - name: SCRAPE_INTERVAL
              value: "{{ .Values.integrations.redfishNm.scrapeInterval | default 15 }}"
            - name: BMC_TIMEOUT
              value: "{{ .Values.integrations.redfishNm.bmcTimeout | default 8 }}"
            - name: VERIFY_SSL
              value: "{{ .Values.integrations.redfishNm.verifySSL | default "false" }}"
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nvis-redfish-nm
  labels:
    app.kubernetes.io/name: nvis-redfish-nm
    app.kubernetes.io/component: redfish-nm-exporter
    app.kubernetes.io/part-of: nvis-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nvis-redfish-nm
  ports:
    - name: metrics
      port: 9106
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvis-redfish-nm
  labels:
    app.kubernetes.io/name: nvis-redfish-nm
    app.kubernetes.io/component: redfish-nm-exporter
    app.kubernetes.io/part-of: nvis-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvis-redfish-nm
  endpoints:
    - port: metrics
      interval: {{ .Values.integrations.redfishNm.scrapeInterval | default 15 }}s
      scrapeTimeout: 10s
      path: /metrics
{{- end }}
