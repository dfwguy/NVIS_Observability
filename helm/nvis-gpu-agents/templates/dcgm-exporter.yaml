{{- if .Values.dcgmExporter.enabled }}
---
# DCGM Exporter DaemonSet
# Runs one pod per GPU node. Exposes NVIDIA GPU metrics on :9400.
# Only scheduled on nodes labeled nvidia.com/gpu.present=true
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvis-dcgm-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app: nvis-dcgm-exporter
    {{- include "nvis-gpu-agents.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: nvis-dcgm-exporter
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nvis-dcgm-exporter
        {{- include "nvis-gpu-agents.labels" . | nindent 8 }}
    spec:
      serviceAccountName: nvis-gpu-agents
      # Use host network so Alloy (also hostNetwork) can scrape localhost:9400
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        {{- toYaml .Values.dcgmExporter.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.dcgmExporter.tolerations | nindent 8 }}
      containers:
        - name: dcgm-exporter
          image: {{ include "nvis.image" (dict "root" . "repo" .Values.dcgmExporter.image.repository "tag" .Values.dcgmExporter.image.tag) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: {{ .Values.dcgmExporter.port }}
              hostPort: {{ .Values.dcgmExporter.port }}
              protocol: TCP
          env:
            - name: DCGM_EXPORTER_LISTEN
              value: ":{{ .Values.dcgmExporter.port }}"
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"
          securityContext:
            privileged: true  # Required: DCGM needs direct GPU device access
          volumeMounts:
            # Required for DCGM to discover GPU pods
            - name: pod-gpu-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
          resources:
            {{- toYaml .Values.dcgmExporter.resources | nindent 12 }}
      volumes:
        - name: pod-gpu-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
---
# Headless service for DCGM — allows Prometheus/Alloy to discover pods by label
apiVersion: v1
kind: Service
metadata:
  name: nvis-dcgm-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app: nvis-dcgm-exporter
    {{- include "nvis-gpu-agents.labels" . | nindent 4 }}
  annotations:
    # Prometheus scrape annotations (for any prometheus.kubernetes_sd_config setups)
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.dcgmExporter.port }}"
    prometheus.io/path: "/metrics"
spec:
  clusterIP: None  # headless — DNS resolves to pod IPs directly
  selector:
    app: nvis-dcgm-exporter
  ports:
    - name: metrics
      port: {{ .Values.dcgmExporter.port }}
      targetPort: {{ .Values.dcgmExporter.port }}
      protocol: TCP
{{- end }}
